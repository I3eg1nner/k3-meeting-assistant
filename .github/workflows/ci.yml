name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: bash -n install.sh scripts/deploy-k3.sh deploy/activate-release.sh deploy/install-k3.sh deploy/quickstart.sh deploy/bundle-header.sh
      - run: python scripts/prepare_release.py
      - run: npm run build:k3
      - run: python scripts/package_k3.py
      - uses: actions/upload-artifact@v4
        with:
          name: k3-application-installer
          path: |
            release/k3-meeting-assistant-k3.run
            release/k3-meeting-assistant-k3.run.sha256
