[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "k3-meeting-assistant"
version = "0.1.0"
description = "Evidence-first asynchronous meeting assistant for SpacemiT K3"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.118,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.20,<1",
  "pydantic>=2.9,<3",
  "Pillow>=10,<13",
  "python-docx>=1.1,<2",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=7.4,<9"]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"
